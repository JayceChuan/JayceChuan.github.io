<header class="section-heading">
  <p class="section-index" aria-hidden="true">{{ include.index }}</p>
  <div>
    <h2 id="{{ include.section.section_id }}-title">
      <span data-lang="en">{{ include.section.title.en }}</span>
      <span data-lang="zh" hidden>{{ include.section.title.zh }}</span>
    </h2>
    <p class="section-intro">
      <span data-lang="en">{{ include.section.intro.en }}</span>
      <span data-lang="zh" hidden>{{ include.section.intro.zh }}</span>
    </p>
  </div>
</header>
